# Somente leitura: apenas get/list/watch, e nenhum acesso a Secrets.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: ocp-cluster-mcp-readonly
rules:
  - apiGroups: [""]
    resources: [nodes, namespaces, pods, pods/log, events, services, persistentvolumeclaims, resourcequotas]
    verbs: [get, list, watch]
  - apiGroups: [apps]
    resources: [deployments]
    verbs: [get, list, watch]
  - apiGroups: [config.openshift.io]
    resources: [clusterversions, clusteroperators]
    verbs: [get, list, watch]
  - apiGroups: [route.openshift.io]
    resources: [routes]
    verbs: [get, list, watch]
  - apiGroups: [serving.kserve.io]
    resources: [inferenceservices]
    verbs: [get, list, watch]
  # Uso real de CPU e memória (o mesmo de "oc adm top").
  - apiGroups: [metrics.k8s.io]
    resources: [pods, nodes]
    verbs: [get, list]
  # Atualizações de operadores (OLM).
  - apiGroups: [operators.coreos.com]
    resources: [subscriptions]
    verbs: [get, list, watch]
