# Somente leitura: apenas get/list/watch, e nenhum acesso a Secrets.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: ocp-cluster-mcp-readonly
rules:
  - apiGroups: [""]
    resources: [nodes, namespaces, pods, pods/log, events, services, persistentvolumeclaims, resourcequotas]
    verbs: [get, list, watch]
  # Uso atual de CPU/memória de nós e pods (describe_nodes, get_project_capacity).
  - apiGroups: [metrics.k8s.io]
    resources: [nodes, pods]
    verbs: [get, list]
  # Atualizações de operadores instalados pelo OperatorHub (check_updates).
  - apiGroups: [operators.coreos.com]
    resources: [subscriptions, installplans]
    verbs: [get, list, watch]
  - apiGroups: [apps]
    resources: [deployments]
    verbs: [get, list, watch]
  - apiGroups: [config.openshift.io]
    resources: [clusterversions, clusteroperators]
    verbs: [get, list, watch]
  - apiGroups: [route.openshift.io]
    resources: [routes]
    verbs: [get, list, watch]
  - apiGroups: [serving.kserve.io]
    resources: [inferenceservices]
    verbs: [get, list, watch]
