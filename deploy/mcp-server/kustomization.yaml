apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# Troque pelo projeto onde o servidor MCP vai rodar (o mesmo do Playground/OGX facilita).
namespace: ocp-mcp
resources:
  - namespace.yaml
  - serviceaccount.yaml
  - clusterrole.yaml
  - clusterrolebinding.yaml
  - imagestream.yaml
  - buildconfig.yaml
  - deployment.yaml
  - service.yaml
labels:
  - pairs:
      app.kubernetes.io/name: ocp-cluster-mcp
      app.kubernetes.io/part-of: ocp-ai-lab
    includeSelectors: false
